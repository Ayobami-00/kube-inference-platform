# Reviewed, CPU-only AIPerf gateway smoke. Variables are injected from the
# task-owned Kubernetes Gateway and root-only synthetic tenant credential file.
schemaVersion: "2.0"
randomSeed: 42
benchmark:
  model: qwen2.5-7b-instruct
  endpoint:
    url: ${KIP_PILOT_GATEWAY_URL}/v1/chat/completions
    type: chat
    streaming: true
    timeout: 120.0
    api_key: ${KIP_PILOT_TOKEN}
  dataset:
    type: synthetic
    entries: 24
    isl: {mean: 128, stddev: 0}
    osl: {mean: 64, stddev: 0}
  warmup:
    type: concurrency
    requests: 4
    concurrency: 2
  profiling:
    type: concurrency
    requests: 24
    concurrency: 4
  artifacts:
    dir: ${KIP_PILOT_ARTIFACTS}
    summary: [json]
    records: [jsonl]
