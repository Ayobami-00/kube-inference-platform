# Conservative v0.1 baseline: kube-proxy remains responsible for Service translation.
kubeProxyReplacement: false

ipam:
  mode: kubernetes

routingMode: tunnel
tunnelProtocol: vxlan

ipv4:
  enabled: true
ipv6:
  enabled: false

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

hubble:
  enabled: false

cni:
  exclusive: true
# Metrics are exposed here and discovered by KIP-owned ServiceMonitors after the
# observability milestone is installed. Hubble remains intentionally disabled.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false
