# Pinned llm-d v0.10 gateway-mode router. KIP alone owns model Deployments;
# this chart owns only the InferencePool, endpoint picker, and HTTPRoute.
provider:
  name: none

router:
  modelServers:
    type: vllm
    protocol: http
    matchLabels:
      app.kubernetes.io/instance: kip-qwen25-pilot
    targetPorts:
      - number: 8000
  inferencePool:
    create: true
    failureMode: FailClose
  epp:
    replicas: 1
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [kip-control]
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    pluginsConfigFile: kip-pilot-plugins.yaml
    pluginsCustomConfig:
      kip-pilot-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: approx-prefix-cache-producer
          - type: prefix-cache-scorer
          - type: kv-cache-utilization-scorer
          - type: queue-scorer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: kv-cache-utilization-scorer
                weight: 2
              - pluginRef: prefix-cache-scorer
                weight: 3
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v0.10.0@sha256:9862ae38658824b2560c547237363fe21f269e649b873a4ee84fe3137b554ba9
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "8"
        memory: 8Gi

httpRoute:
  create: true
  inferenceGatewayName: kip-inference-gateway
  requestTimeout: 300s
