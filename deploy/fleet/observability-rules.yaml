apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kip-fleet-inference
  namespace: kip-observability
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    release: kip-monitoring
spec:
  groups:
    - name: kip.fleet.health
      interval: 15s
      rules:
        - record: kip:fleet:nodes_ready
          expr: kube_node_status_condition{condition="Ready",status="true"}
          labels:
            cluster: kip-pilot
        - record: kip:fleet:replicas_ready
          expr: kube_deployment_status_replicas_available{namespace="kip-inference",deployment="kip-qwen25-pilot"}
          labels:
            cluster: kip-pilot
        - record: kip:fleet:requests_completed_rate5m
          expr: sum by (cluster,namespace,model_name,model_profile,node,pod) (rate(vllm:request_success_total{finished_reason=~"stop|length"}[5m]))
        - record: kip:fleet:tokens_generated_rate5m
          expr: sum by (cluster,namespace,model_name,model_profile,node,pod) (rate(vllm:generation_tokens_total[5m]))
        - record: kip:fleet:requests_waiting
          expr: sum by (cluster,namespace,model_name,model_profile,node,pod) (vllm:num_requests_waiting)
        - record: kip:fleet:kv_cache_utilization_ratio
          expr: max by (cluster,namespace,model_name,model_profile,node,pod) (vllm:kv_cache_usage_perc)
        - record: kip:fleet:ttft_p95_seconds
          expr: histogram_quantile(0.95, sum by (le,cluster,namespace,model_name,model_profile) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
        - record: kip:fleet:gpu_utilization_ratio
          expr: DCGM_FI_DEV_GPU_UTIL{exported_namespace="kip-inference"} / 100
        - record: kip:fleet:gpu_memory_used_mib
          expr: DCGM_FI_DEV_FB_USED{exported_namespace="kip-inference"}
        - record: kip:fleet:gpu_power_watts
          expr: DCGM_FI_DEV_POWER_USAGE{exported_namespace="kip-inference"}
        - record: kip:fleet:gpu_temperature_celsius
          expr: DCGM_FI_DEV_GPU_TEMP{exported_namespace="kip-inference"}
    - name: kip.fleet.routing
      interval: 15s
      rules:
        - record: kip:fleet:tenant_requests_rate5m
          expr: sum by (cluster,namespace,fairness_id,priority,model_name) (rate(llm_d_epp_request_total[5m]))
        - record: kip:fleet:flow_outcomes_rate5m
          expr: sum by (cluster,namespace,inference_pool,outcome,priority) (rate(llm_d_epp_flow_control_requests_total[5m]))
        - record: kip:fleet:flow_queue_depth
          expr: sum by (cluster,namespace,inference_pool,model_name,priority,fairness_id) (llm_d_epp_flow_control_queue_size)
        - record: kip:fleet:flow_ttl_evictions_rate5m
          expr: sum by (cluster,namespace,inference_pool,priority) (rate(llm_d_epp_flow_control_requests_total{outcome="EvictedTTL"}[5m]))
        - record: kip:fleet:pool_queue
          expr: max by (cluster,namespace,inference_pool) (llm_d_epp_average_queue_size)
        - record: kip:fleet:ready_endpoints
          expr: max by (cluster,namespace,inference_pool) (llm_d_epp_ready_endpoints)
    - name: kip.fleet.cost
      interval: 30s
      rules:
        - record: kip:fleet:node_rental_usd_per_hour
          expr: max by (node) (node_total_hourly_cost{job="kip-opencost"})
          labels:
            cluster: kip-pilot
        - record: kip:fleet:rental_usd_per_hour
          expr: sum(kip:fleet:node_rental_usd_per_hour)
          labels:
            cluster: kip-pilot
