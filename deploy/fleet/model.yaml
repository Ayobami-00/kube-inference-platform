# KIP owns these workloads. The llm-d chart must select, never create or mutate,
# the model Pods. Both replicas use the same immutable image and model revision.
apiVersion: v1
kind: Namespace
metadata:
  name: kip-inference
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/part-of: kube-inference-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kip-qwen25-pilot
  namespace: kip-inference
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/part-of: kube-inference-platform
    app.kubernetes.io/component: llmd-model
    app.kubernetes.io/instance: kip-qwen25-pilot
  annotations:
    kube-inference-platform.io/model-revision: a09a35458c702b33eeacc393d103063234e8bc28
    kube-inference-platform.io/runtime-version: v0.30.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  progressDeadlineSeconds: 2700
  selector:
    matchLabels:
      app.kubernetes.io/instance: kip-qwen25-pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kube-inference-platform
        app.kubernetes.io/part-of: kube-inference-platform
        app.kubernetes.io/component: llmd-model
        app.kubernetes.io/instance: kip-qwen25-pilot
        kube-inference-platform.io/runtime: vllm
        kube-inference-platform.io/model-profile: qwen2.5-7b-instruct-fleet
        kube-inference-platform.io/served-model: qwen2.5-7b-instruct
        kube-inference-platform.io/model-revision: a09a35458c702b33eeacc393d103063234e8bc28
        kube-inference-platform.io/worker-role: combined
      annotations:
        kube-inference-platform.io/image-digest: sha256:5f5e535216848d0c52159c8c13a0af04be5f6fe1a84e79914300610796f76d40
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kube-inference-platform.io/fleet-role: gpu-worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: kip-qwen25-pilot
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.30.0@sha256:5f5e535216848d0c52159c8c13a0af04be5f6fe1a84e79914300610796f76d40
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen2.5-7B-Instruct
            - --revision
            - a09a35458c702b33eeacc393d103063234e8bc28
            - --tokenizer-revision
            - a09a35458c702b33eeacc393d103063234e8bc28
            - --served-model-name
            - qwen2.5-7b-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --tensor-parallel-size
            - "1"
            - --max-model-len
            - "6144"
            - --gpu-memory-utilization
            - "0.90"
            - --max-num-seqs
            - "8"
            - --seed
            - "42"
            - --enable-prefix-caching
          env:
            - name: HF_HOME
              value: /var/cache/kip/huggingface
            # Envoy reuses upstream connections across inter-request gaps.
            # vLLM's 5s default can close one just before Envoy reuses it.
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "60"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 48Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: model-cache
              mountPath: /var/cache/kip
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          hostPath:
            path: /var/lib/kube-inference-platform/model-cache/vllm
            type: Directory
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kip-qwen25-pilot
  namespace: kip-inference
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/part-of: kube-inference-platform
    app.kubernetes.io/component: llmd-model
    app.kubernetes.io/instance: kip-qwen25-pilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: kip-qwen25-pilot
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
