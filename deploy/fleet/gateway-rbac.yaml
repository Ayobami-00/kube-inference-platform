# Envoy Gateway v1.8.1 must watch InferencePool resources for the llm-d route.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kip-envoy-inference-access
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/part-of: kube-inference-platform
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kip-envoy-inference-access
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/part-of: kube-inference-platform
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
roleRef:
  kind: ClusterRole
  name: kip-envoy-inference-access
  apiGroup: rbac.authorization.k8s.io
