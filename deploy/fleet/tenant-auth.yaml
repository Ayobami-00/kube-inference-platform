# The slim Python image is pinned to the official linux/amd64 manifest digest.
# The content-free auth code is delivered by an owned ConfigMap; credentials
# are generated once and mounted from an owned Kubernetes Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kip-tenant-auth
  namespace: kip-inference
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/component: tenant-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kip-tenant-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kip-tenant-auth
        app.kubernetes.io/managed-by: kube-inference-platform
        app.kubernetes.io/component: tenant-auth
      annotations:
        kube-inference-platform.io/auth-script-sha256: __AUTH_SCRIPT_SHA256__
    spec:
      nodeSelector:
        kube-inference-platform.io/fleet-role: control-plane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: docker.io/library/python:3.12.15-slim-bookworm@sha256:2ed6491b93cd49272ee6de2b5a38440c3448360322c089fc23e370722d74179d
          imagePullPolicy: IfNotPresent
          command: [python3, /app/auth.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          volumeMounts:
            - name: auth-code
              mountPath: /app
              readOnly: true
            - name: credentials
              mountPath: /var/run/kip-tenant-keys
              readOnly: true
      volumes:
        - name: auth-code
          configMap:
            name: kip-tenant-auth-code
            defaultMode: 0444
        - name: credentials
          secret:
            secretName: kip-tenant-credentials
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: kip-tenant-auth
  namespace: kip-inference
  labels:
    app.kubernetes.io/managed-by: kube-inference-platform
    app.kubernetes.io/component: tenant-auth
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kip-tenant-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
